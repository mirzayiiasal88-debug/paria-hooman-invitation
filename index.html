<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #6d0f18;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

button {
  background: transparent;
  color: #d9b66f;
  border: 1px solid #d9b66f;
  border-radius: 40px;
  padding: 17px 60px;
  font-family: Georgia, serif;
  font-size: 21px;
  letter-spacing: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<button id="openButton" onclick="openInvitation()">OPEN</button>

<audio id="music" loop preload="auto">
  <source src="paulyudin-romantic-wedding-piano-160698.mp3" type="audio/mpeg">
</audio>

<script>
function openInvitation() {
  const music = document.getElementById("music");

  music.play();

  setTimeout(function () {
    window.open(
      "https://www.invitedrop.com/i/896d8a99-e9eb-4ed6-8505-0fb7fe46d767",
      "_blank"
    );
  }, 300);
}
</script>

</body>
</html>
