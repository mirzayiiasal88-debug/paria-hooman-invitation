<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پریا و هومن</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6d0f18;
      font-family: serif;
      text-align: center;
      color: #d9b66f;
    }

    .box {
      padding: 40px 25px;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #f1dfc0;
      margin-bottom: 35px;
    }

    button {
      background: transparent;
      color: #d9b66f;
      border: 1px solid #d9b66f;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>پریا و هومن</h1>
    <p>برای مشاهده دعوت‌نامه لمس کنید</p>

    <button onclick="openInvitation()">
      باز کردن دعوت‌نامه
    </button>
  </div>

  <script>
    function openInvitation() {
      window.location.href =
      "https://www.invitedrop.com/i/896d8a99-e9eb-4ed6-8505-0fb7fe46d767";
    }
  </script>

</body>
</html>
