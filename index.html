<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #6d0f18;
}

#start {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #6d0f18;
  z-index: 10;
}

button {
  background: transparent;
  color: #d9b66f;
  border: 1px solid #d9b66f;
  border-radius: 40px;
  padding: 16px 55px;
  font-family: Georgia, serif;
  font-size: 20px;
  letter-spacing: 4px;
}

#invite {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}
</style>
</head>

<body>

<div id="start">
  <button onclick="openInvitation()">OPEN</button>
</div>

<audio id="music" loop>
  <source src="paulyudin-romantic-wedding-piano-160698.mp3" type="audio/mpeg">
</audio>

<iframe
  id="invite"
  src="https://www.invitedrop.com/i/896d8a99-e9eb-4ed6-8505-0fb7fe46d767"
  allow="autoplay">
</iframe>

<script>
function openInvitation() {
  const music = document.getElementById("music");
  music.play().catch(() => {});

  document.getElementById("start").style.display = "none";
  document.getElementById("invite").style.display = "block";
}
</script>

</body>
</html>
